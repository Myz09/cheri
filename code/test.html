<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connected Statistics Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: auto auto;
      gap: 10px;
      width: 80%;
      margin: 40px auto;
    }
    .main-stat {
      grid-column: 1 / span 3; /* spans all 3 columns */
      background: #3498db;
      color: white;
      text-align: center;
      font-size: 2em;
      font-weight: bold;
      padding: 20px;
      border-radius: 8px 8px 0 0; /* rounded top corners */
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .card {
      background: white;
      border: 1px solid #ddd;
      text-align: center;
      padding: 20px;
      font-size: 1.5em;
      color: #2c3e50;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .label {
      font-size: 1em;
      color: #555;
      margin-top: 10px;
    }
    button {
      display: block;
      margin: 20px auto;
      padding: 10px 15px;
      border: none;
      background: #3498db;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <header>
    <h1>Statistics Dashboard</h1>
  </header>

  <div class="stats-grid">
    <!-- Top main statistic -->
    <div class="main-stat" id="mainStat">
      Total Performance: 0
    </div>

    <!-- Three connected stats -->
    <div class="card">
      <div id="users">0</div>
      <div class="label">Users</div>
    </div>
    <div class="card">
      <div id="sales">0</div>
      <div class="label">Sales</div>
    </div>
    <div class="card">
      <div id="growth">0%</div>
      <div class="label">Growth</div>
    </div>
  </div>

  <button onclick="updateStats()">Update Stats</button>

  <script>
    function updateStats() {
      const users = Math.floor(Math.random() * 1000);
      const sales = Math.floor(Math.random() * 500);
      const growth = Math.floor(Math.random() * 100);

      document.getElementById("users").textContent = users;
      document.getElementById("sales").textContent = sales;
      document.getElementById("growth").textContent = growth + "%";

      // Example main statistic: sum of users + sales
      const totalPerformance = users + sales;
      document.getElementById("mainStat").textContent = "Total Performance: " + totalPerformance;
    }
  </script>
</body>
</html>
