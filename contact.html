    <style>
        .contact-container {
        max-width: 600px;
        margin: 50px auto;
        background-color: #fff;
        padding: 30px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .contact-container h1 {
        margin-bottom: 20px;
        text-align: center;
        }

        form label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        }

        form input,
        form textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #aaa;
        border-radius: 5px;
        }

        button {
        margin-top: 20px;
        padding: 10px 15px;
        background-color: #333;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        }

    </style>

    <style>
        label p{
            font-family:'Bitter';
            color:#907f94;
            font-weight:40  0;
        }
    </style>

<body>
    <div class="site">
        <header id="header"></header>
        <h1 style="text-align:center;">Contact Us</h1>
        <h3 style="font-family:'DM Sans';padding-bottom:7.5dvh;text-align:center;"></h3>
        <main>
            <section class="contact-container">
                <h1 style="font-family:'Bitter';font-weight:350;color:#907f94;">Email Us</h1>
                <form action="mailto:cherielle.code@gmail.com" method="post" enctype="text/plain">
                    <label for="name"><p>Name:</p></label>
                    <input type="text" id="name" name="name" required>

                    <label for="email"><p>Email:</p></label>
                    <input type="email" id="email" name="email" required>

                    <label for="message"><p>Message:</p></label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit" style="font-family:Bitter;background-color:#907f94;">Send</button>
                </form>
            </section>
        </main>
    </div>
